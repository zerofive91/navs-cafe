<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#a8cf8e">
  <title>네비게이토 카페</title>
  <meta name="description" content="명지대학교 네비게이토의 온라인 쉼터. 말없이 함께 머무는 수레바퀴 카페.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cafe" aria-label="수레바퀴 카페"></canvas>
  <div id="actions" role="toolbar"></div>
  <div id="places" role="toolbar"></div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="hint" hidden aria-hidden="true">
    <svg viewBox="0 0 32 32" width="40" height="40" fill="#fffaf0" stroke="#8a6a50" stroke-width="1.6" stroke-linejoin="round"><path d="M12 30v-5l-4-5c-1-1.4 0-3 1.6-2.4L12 19V6a2 2 0 0 1 4 0v8h1a2 2 0 0 1 2 1.6 2 2 0 0 1 3 1.4 2 2 0 0 1 3 1.6V24l-2 6z"/></svg>
  </div>
  <button id="enter" aria-label="들어가기">
    <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="32" cy="32" r="26"/>
      <circle cx="32" cy="32" r="6"/>
      <path d="M32 6v20M32 38v20M6 32h20M38 32h20"/>
    </svg>
  </button>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
