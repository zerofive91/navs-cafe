<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#a8cf8e">
  <title>Wheel Life Cafe · 네비게이토</title>
  <meta name="description" content="Wheel Life Cafe: 명지대학교 네비게이토의 온라인 쉼터. 말없이 함께 머무는 수레바퀴 카페.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cafe" aria-label="Wheel Life Cafe"></canvas>
  <div id="actions" role="toolbar"></div>
  <div id="places" role="toolbar"></div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="verse" hidden aria-live="polite"><p></p><cite></cite></div>
  <div id="hint" hidden aria-hidden="true">
    <svg viewBox="0 0 32 32" width="40" height="40" fill="#fffaf0" stroke="#8a6a50" stroke-width="1.6" stroke-linejoin="round"><path d="M12 30v-5l-4-5c-1-1.4 0-3 1.6-2.4L12 19V6a2 2 0 0 1 4 0v8h1a2 2 0 0 1 2 1.6 2 2 0 0 1 3 1.4 2 2 0 0 1 3 1.6V24l-2 6z"/></svg>
  </div>
  <div id="enter">
    <span class="art" aria-hidden="true"></span>
    <span class="veil" aria-hidden="true"></span>
    <span class="title"><small>Navigators</small>Wheel Life <br>Cafe</span>
    <!-- 들어가는 방법: 혼자 / 함께(랜덤) / 초대 링크. 초대 링크로 오면 문 하나만 보임 -->
    <div class="modes" role="group" aria-label="들어가기">
      <button class="mode" data-mode="solo"><span class="ring"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="10" r="4"/><path d="M8 27v-3a8 8 0 0 1 16 0v3"/></svg></span><span>혼자</span></button>
      <button class="mode main" data-mode="random"><span class="ring"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="9" r="3.4"/><circle cx="7.5" cy="13" r="2.8"/><circle cx="24.5" cy="13" r="2.8"/><path d="M10 27v-3a6 6 0 0 1 12 0v3"/><path d="M3 26v-2a4.5 4.5 0 0 1 7-3.7M29 26v-2a4.5 4.5 0 0 0-7-3.7"/></svg></span><span>다같이</span></button>
      <button class="mode" data-mode="invite"><span class="ring"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 18.5l5-5"/><path d="M11 15l-3 3a4.2 4.2 0 0 0 6 6l3-3"/><path d="M21 17l3-3a4.2 4.2 0 0 0-6-6l-3 3"/></svg></span><span>초대</span></button>
      <button class="mode main big" data-mode="invite" data-arrive hidden><span class="ring"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 28V8a7 7 0 0 1 14 0v20M5 28h22"/><circle cx="19" cy="18" r="1" fill="currentColor"/></svg></span><span>초대받은 카페</span></button>
    </div>
    <script>
      // 3D 장면을 불러오는 동안에도 단추가 바로 보이고 눌림. 누른 것은 기억했다가 준비되면 들어감
      (function () {
        var bs = document.querySelectorAll('#enter .mode');
        if (/[?&]c=[a-z0-9]{4,16}/.test(location.search)) for (var i = 0; i < bs.length; i++) bs[i].hidden = !bs[i].hasAttribute('data-arrive');
        for (var j = 0; j < bs.length; j++) bs[j].addEventListener('click', function (e) {
          if (window.__enterReady) return;
          window.__pick = e.currentTarget.getAttribute('data-mode');
          for (var k = 0; k < bs.length; k++) bs[k].disabled = true;
        });
      })();
    </script>
  </div>
  <div id="toast" hidden aria-live="polite"></div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
